name: Deploy Spring Boot & Next.js to Ubuntu Server

# develop 브랜치에 코드가 push 되거나 merge 될 때 동작합니다.
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # ========================================================
            # 공통: 프로젝트 폴더 이동 및 코드 업데이트
            # ========================================================
            cd /home/ubuntu/kidmily
            git pull origin develop
            
            # 기존에 실행 중이던 algoga tmux 세션이 있다면 강제 종료 (포트 충돌 방지)
            tmux kill-session -t algoga 2>/dev/null || true
            
            # ========================================================
            # 1. Spring Boot 배포 (algoga 세션)
            # ========================================================
            # Gradle 빌드 진행
            chmod +x ./gradlew
            ./gradlew clean build -x test
            
            # jar 파일 경로 찾기
            JAR_PATH=$(ls build/libs/*.jar | grep -v 'plain' | tail -n 1)
            
            # algoga 라는 이름의 새 tmux 세션을 백그라운드로 생성
            tmux new-session -d -s algoga
            
            # 스프링 애플리케이션 실행 명령어 전송
            echo "새 스프링 애플리케이션을 algoga tmux 세션에서 실행합니다: $JAR_PATH"
            tmux send-keys -t algoga "java -jar $JAR_PATH" C-m

            # ========================================================
            # 2. Next.js 배포 (algoga 세션 내부에서 추가 실행)
            # ========================================================
            # algoga 폴더로 이동
            cd algoga
            
            # 의존성 설치 및 프로덕션 빌드
            echo "Next.js 의존성 설치 및 빌드를 시작합니다..."
            npm install
            npm run build
            
            # 동일한 algoga 세션에서 새 윈도우를 열거나 
            # 기존 세션에 명령어를 이어서 전송하여 17000 포트로 Next.js 서버 실행
            echo "Next.js 애플리케이션을 algoga tmux 세션의 17000 포트에서 실행합니다."
            tmux send-keys -t algoga "PORT=17000 npm start" C-m
